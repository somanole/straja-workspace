# Straja Guard configuration (auto-generated by Straja Workspace)
# See https://straja.ai/docs/configuration.html for full reference.

server:
  listen_addr: "127.0.0.1:8080"
  read_timeout: 30s
  write_timeout: 60s

# Provider credentials — set via environment variables
providers:
  - id: openai_default
    type: openai
    api_key_env: OPENAI_API_KEY

  - id: claude_default
    type: claude
    api_key_env: ANTHROPIC_API_KEY

projects:
  - id: workspace
    provider: openai_default
    api_keys:
      - "sk-straja-workspace-local"

logging:
  level: info

activation:
  enabled: true
  sinks:
    - type: webhook
      url: "http://127.0.0.1:8181/connections/guard/activation"
      timeout: 5s
      retry_count: 2

policy:
  prompt_injection:
    action: block
  jailbreak:
    action: block
  pii:
    action: redact
  secrets:
    action: block
  data_exfil:
    action: block
